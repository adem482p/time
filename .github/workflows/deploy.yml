name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install poppler-utils (required by data/extract.py)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Configure Pages build metadata
        uses: actions/configure-pages@v5

      - name: Preprocess static inputs
        # Generates data/time.csv via data/extract.py if missing, then copies
        # it and root assets/ into app/static/ so the site has its inputs.
        run: node scripts/preprocess.mjs

      - name: Build site
        run: npm run build
        working-directory: app
        env:
          # Project pages are served from /<repo>/ on GitHub Pages.
          PUBLIC_BASE: /time

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
