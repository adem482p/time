<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable matrix — Emplois</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="matrix">
<button type="button" id="themeCycle" title="Cycle color preset" aria-label="Cycle color preset"></button>
<h1>Teachers × Time slots</h1>
<p id="status">Loading emplois.csv…</p>
<div id="controls">
  <label>Day:
    <select id="dayFilter">
      <option value="">All days</option>
      <option value="LUNDI">lundi</option><option value="MARDI">mardi</option><option value="MERCREDI">mercredi</option>
      <option value="JEUDI">jeudi</option><option value="VENDREDI">vendredi</option><option value="SAMEDI">samedi</option>
    </select>
  </label>
  <label>Teacher: <input id="search" type="search" placeholder="Filter…" autocomplete="off"></label>
</div>
<div id="matrixWrap"><table id="matrix"></table></div>
<script src="js/data.js"></script>
<script src="js/libgroups.js"></script>
<script src="js/model.js"></script>
<script src="js/match.js"></script>
<script src="js/theme.js"></script>
<script src="js/color.js"></script>
<script src="js/app.js"></script>
</body>
</html>
