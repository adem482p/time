<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Timetable matrix — Emplois</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script>
/* Issue 066: replay the stored theme before first paint — js/theme.js persists
   the applied --md- and --pal- custom properties per scheme; write them
   verbatim so the first frame is already themed. Idempotent: theme.js writes
   the same values again. (Never write a literal star-slash inside this
   comment — it would terminate it early.) */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('emplois-theme') || 'null');
    if (!s || !s.vars) return;             /* first visit / old shape: CSS defaults */
    var d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var v = s.vars[d ? 'dark' : 'light'];
    if (!v) return;
    var st = document.documentElement.style;
    for (var k in v) if (v.hasOwnProperty(k)) st.setProperty(k, v[k]);
  } catch (e) { /* corrupt/unavailable storage: default theme */ }
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="matrix">
<button type="button" id="themeCycle" title="Cycle color preset" aria-label="Cycle color preset"></button>
<h1>Teachers × Time slots</h1>
<p id="status">Loading emplois.csv…</p>
<div id="controls">
  <label>Day:
    <select id="dayFilter">
      <option value="">All days</option>
      <option value="LUNDI">lundi</option><option value="MARDI">mardi</option><option value="MERCREDI">mercredi</option>
      <option value="JEUDI">jeudi</option><option value="VENDREDI">vendredi</option><option value="SAMEDI">samedi</option>
    </select>
  </label>
  <label>Teacher: <input id="search" type="search" placeholder="Filter…" autocomplete="off"></label>
</div>
<div id="matrixWrap"><table id="matrix"></table></div>
<script src="js/data.js"></script>
<script src="js/libgroups.js"></script>
<script src="js/model.js"></script>
<script src="js/match.js"></script>
<script src="js/theme.js"></script>
<script src="js/color.js"></script>
<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
