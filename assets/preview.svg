<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arimo, 'Noto Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4da2"/>
      <stop offset="0.55" stop-color="#083a7d"/>
      <stop offset="1" stop-color="#052455"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5fb"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a63c4"/>
      <stop offset="1" stop-color="#2f7ce0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#02163a" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="60" r="230" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="90" cy="600" r="180" fill="#ffffff" fill-opacity="0.05"/>

  <!-- left: wordmark + tagline -->
  <text x="80" y="212" fill="#ffffff" font-size="96" font-weight="bold" letter-spacing="-2">Emplois</text>
  <rect x="82" y="238" width="118" height="7" rx="3.5" fill="#7fb2ff"/>
  <text x="80" y="308" fill="#dce8fb" font-size="34">The 2026–2027 timetable for</text>
  <text x="80" y="356" fill="#ffffff" font-size="40" font-weight="bold">ISIM Mahdia</text>
  <text x="80" y="416" fill="#a9c6ef" font-size="24">LBC · LCE · LCS · MPExpRes</text>
  <rect x="80" y="452" width="430" height="56" rx="28" fill="#ffffff" fill-opacity="0.12"/>
  <text x="112" y="488" fill="#eaf2ff" font-size="24">Search a teacher, class or subject</text>

  <!-- right: app card mockup -->
  <g filter="url(#shadow)">
    <rect x="640" y="96" width="480" height="438" rx="28" fill="url(#card)"/>
  </g>
  <rect x="676" y="132" width="408" height="56" rx="28" fill="#e7edf8"/>
  <circle cx="706" cy="158" r="10" fill="none" stroke="#0b4da2" stroke-width="4"/>
  <line x1="713" y1="165" x2="722" y2="174" stroke="#0b4da2" stroke-width="4" stroke-linecap="round"/>
  <text x="740" y="167" fill="#5b6b85" font-size="22">Search teacher…</text>

  <!-- list rows -->
  <g>
    <rect x="676" y="212" width="408" height="64" rx="16" fill="#e8eefb"/>
    <rect x="692" y="228" width="74" height="32" rx="16" fill="url(#chip)"/>
    <text x="729" y="250" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">Mon</text>
    <text x="784" y="240" fill="#1b2a44" font-size="21" font-weight="bold">08:00 – 10:00</text>
    <text x="784" y="264" fill="#5b6b85" font-size="18">B12 · Algorithmique</text>
  </g>
  <g>
    <rect x="676" y="288" width="408" height="64" rx="16" fill="#f1f4fa"/>
    <rect x="692" y="304" width="74" height="32" rx="16" fill="#8aa4c9"/>
    <text x="729" y="326" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">Tue</text>
    <text x="784" y="316" fill="#1b2a44" font-size="21" font-weight="bold">10:00 – 12:00</text>
    <text x="784" y="340" fill="#5b6b85" font-size="18">A03 · Bases de données</text>
  </g>
  <g>
    <rect x="676" y="364" width="408" height="64" rx="16" fill="#f1f4fa"/>
    <rect x="692" y="380" width="74" height="32" rx="16" fill="#8aa4c9"/>
    <text x="729" y="402" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">Wed</text>
    <text x="784" y="392" fill="#1b2a44" font-size="21" font-weight="bold">14:00 – 16:00</text>
    <text x="784" y="416" fill="#5b6b85" font-size="18">C21 · Réseaux</text>
  </g>
  <rect x="676" y="444" width="408" height="56" rx="16" fill="#0b4da2"/>
  <text x="880" y="479" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">adem482p.github.io/time</text>
</svg>
